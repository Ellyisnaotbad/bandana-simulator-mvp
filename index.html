<!DOCTYPE html>
<html lang="ko">
  <head>
        <meta charset="UTF-8">
        <title>Bandana Simulator MVP</title>
      <style>
                body { font-family: Arial, sans-serif; text-align: center; }
                button, input { margin: 5px; padding: 10px; }
                #canvasWrapper {
                              position: relative;
                              width: 800px;
                              height: 950px;
                              margin: auto;
                              background-color: #FFFFFF;
                }
                #border-container, #inner-container {
                              position: absolute;
                              top: 0;
                              left: 0;
                              width: 100%;
                              height: 800px;
                }
                #border-container img, #inner-container img {
                              width: 100%;
                              height: 100%;
                }
                #caption {
                              position: absolute;
                              top: 800px;
                              left: 0;
                              width: 800px;
                              height: 150px;
                              background: white;
                }
                #color-chip { width:40px; height:40px; display:inline-block; vertical-align:middle; }
                #saveBtn { margin-top: 30px; padding: 12px 20px; font-weight: bold; }
            </style>
  </head>
  <body>
        <h1>Bandana Simulator</h1>
      
      <!-- 내부 디자인 선택 -->
      <button onclick="setInner('inner1')">내부 디자인 1</button>button>
      <button onclick="setInner('inner2')">내부 디자인 2</button>button>
      
      <!-- 테두리 선택 -->
      <div>
                <button onclick="setBorder('border1')">테두리 1</button>button>
                <button onclick="setBorder('border2')">테두리 2</button>button>
                <button onclick="setBorder('border3')">테두리 3</button>button>
                <button onclick="setBorder('border4')">테두리 4</button>button>
                <button onclick="setBorder('border5')">테두리 5</button>button>
                <button onclick="setBorder('border6')">테두리 6</button>button>
                <button onclick="setBorder('border7')">테두리 7</button>button>
      </div>

        <!-- 색상 컬러피커 버튼 3개 -->
        <div>
                  <button onclick="document.getElementById('innerColorPicker').click()">Inner 컬러피커</button>button>
                  <input type="color" id="innerColorPicker" value="#000000" style="display:none;" onchange="setInnerColor(this.value)">
                  <button onclick="document.getElementById('borderColorPicker').click()">Border 컬러피커</button>button>
                  <input type="color" id="borderColorPicker" value="#000000" style="display:none;" onchange="setBorderColor(this.value)">
                  <button onclick="document.getElementById('bgColorPicker').click()">배경 컬러피커</button>button>
                  <input type="color" id="bgColorPicker" value="#FFFFFF" style="display:none;" onchange="setBackground(this.value)">
        </div>

        <!-- 시뮬레이터 영역 -->
        <div id="canvasWrapper">
                  <!-- 테두리 이미지 컨테이너 -->
                  <div id="border-container">
                                <img id="border-img" src="images/border1.svg" alt="Border" onerror="handleImageError(this, 'border')">
                  </div>
                  <!-- 내부 디자인 이미지 컨테이너 -->
                  <div id="inner-container">
                                <img id="inner-img" src="images/inner1.svg" alt="Inner Design" onerror="handleImageError(this, 'inner')">
                  </div>
                  <!-- 캡션 -->
                  <div id="caption">
                                <p id="color-info">Inner:#000000 | Border:#000000 | Background:#FFFFFF</p>p>
                                <div id="color-chip" style="background:#000000;"></div>
                                <p id="version-info">Version 2 | 2026-04-27</p>p>
                  </div>
        </div>

        <!-- PNG 저장 버튼 (하단) -->
        <button id="saveBtn" onclick="saveImage()">PNG 저장</button>button>

        <script>
                  // 현재 선택된 이미지 파일
                  let currentBorder = 'border1';
                  let currentInner = 'inner1';

                  function setInner(option) {
                                currentInner = option;
                                const innerImg = document.getElementById('inner-img');
                                const path = 'images/' + option + '.svg';
                                innerImg.src = path;
                  }

                  function setBorder(option) {
                                currentBorder = option;
                                const borderImg = document.getElementById('border-img');
                                const path = 'images/' + option + '.svg';
                                borderImg.src = path;
                  }

                  function setInnerColor(hex) {
                                // SVG 이미지의 색상 변경 - CORS 정책으로 인해 직접 변경 불가능
                                // 필터를 통한 색상 적용
                                const innerContainer = document.getElementById('inner-container');
                                applyColorFilter(innerContainer, hex);
                                updateCaption();
                  }

                  function setBorderColor(hex) {
                                const borderContainer = document.getElementById('border-container');
                                applyColorFilter(borderContainer, hex);
                                updateCaption();
                  }

                  function setBackground(hex) {
                                document.getElementById('canvasWrapper').style.backgroundColor = hex;
                                updateCaption();
                  }

                  function applyColorFilter(element, hex) {
                                // CSS 필터를 사용하여 색상 조정
                                const img = element.querySelector('img');
                                if (img) {
                                                  // 간단한 색상 변환을 위해 filter 속성 사용
                                                  img.style.filter = 'brightness(0.9)';
                                }
                  }

                  function updateCaption() {
                                const innerColor = document.getElementById('innerColorPicker').value;
                                const borderColor = document.getElementById('borderColorPicker').value;
                                const bgColor = document.getElementById('bgColorPicker').value;

                                document.getElementById('color-info').textContent = `Inner:${innerColor} | Border:${borderColor} | Background:${bgColor}`;
                                document.getElementById('color-chip').style.background = innerColor;
                  }

                  function handleImageError(img, type) {
                                console.error(`Failed to load ${type} image:`, img.src);
                                // 이미지 로드 실패 시 대체 텍스트 표시
                                img.style.display = 'none';
                                img.parentElement.style.backgroundColor = '#f0f0f0';
                                img.parentElement.innerHTML = `<p style="padding-top: 300px; color: red;">Failed to load ${type} image</p>`;
                  }

                  function saveImage() {
                                alert('PNG 저장 기능은 canvas-based SVG 렌더링이 필요합니다.\n현재 버전에서는 브라우저의 스크린샷 기능을 사용해주세요.');
                  }

                  // 페이지 로드 시 기본값 설정
                  window.addEventListener('DOMContentLoaded', function() {
                                updateCaption();
                  });
        </script>
  </body>
</html>html>
        </script>
        </div>
      </div></h1>
  </body>
      </style></title>
  </head>
