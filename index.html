<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Bandana Simulator MVP</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    button, input { margin: 5px; padding: 10px; }
    #canvasWrapper { 
      position: relative; 
      width: 800px; 
      height: 950px; 
      margin: auto; 
      background-color: #FFFFFF; /* 기본 배경색 */
    }
    svg { position: absolute; top: 0; left: 0; }
    #inner-design { 
      width: 600px; 
      height: 600px; 
      top: 100px; 
      left: 100px; 
      position: absolute; 
    }
    #caption { position: absolute; top: 800px; left: 0; width: 800px; height: 150px; background: white; }
    #color-chip { width:40px; height:40px; display:inline-block; vertical-align:middle; }
    #saveBtn { margin-top: 30px; padding: 12px 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Bandana Simulator</h1>

  <!-- 내부 디자인 선택 -->
  <button onclick="setInner('inner1')">내부 디자인 1</button>
  <button onclick="setInner('inner2')">내부 디자인 2</button>

  <!-- 테두리 선택 -->
  <div>
    <button onclick="setBorder('border1')">테두리 1</button>
    <button onclick="setBorder('border2')">테두리 2</button>
    <button onclick="setBorder('border3')">테두리 3</button>
    <button onclick="setBorder('border4')">테두리 4</button>
    <button onclick="setBorder('border5')">테두리 5</button>
    <button onclick="setBorder('border6')">테두리 6</button>
    <button onclick="setBorder('border7')">테두리 7</button>
  </div>

  <!-- 색상 컬러피커 버튼 3개 -->
  <div>
    <button onclick="document.getElementById('innerColorPicker').click()">Inner 컬러피커</button>
    <input type="color" id="innerColorPicker" value="#000000" style="display:none;" onchange="setInnerColor(this.value)">

    <button onclick="document.getElementById('borderColorPicker').click()">Border 컬러피커</button>
    <input type="color" id="borderColorPicker" value="#000000" style="display:none;" onchange="setBorderColor(this.value)">

    <button onclick="document.getElementById('bgColorPicker').click()">배경 컬러피커</button>
    <input type="color" id="bgColorPicker" value="#FFFFFF" style="display:none;" onchange="setBackground(this.value)">
  </div>

  <!-- 시뮬레이터 영역 -->
  <div id="canvasWrapper">
    <!-- 테두리 SVG -->
    <svg id="border" width="800" height="800" viewBox="0 0 800 800">
      <path d="M10,10 L790,10 L790,790 L10,790 Z" stroke="black" fill="none" stroke-width="10"/>
    </svg>

    <!-- 내부 디자인 SVG -->
    <svg id="inner-design" viewBox="0 0 800 800">
      <circle cx="400" cy="400" r="200" stroke="black" fill="none" stroke-width="5"/>
    </svg>

    <!-- 캡션 -->
    <div id="caption">
      <p id="color-info">Inner:#000000 | Border:#000000 | Background:#FFFFFF</p>
      <div id="color-chip" style="background:#000000;"></div>
      <p id="version-info">Version 1 | 2026-04-27</p>
    </div>
  </div>

  <!-- PNG 저장 버튼 (하단) -->
  <button id="saveBtn" onclick="saveImage()">PNG 저장</button>

  <script>
    function setInner(option) {
      const inner = document.getElementById("inner-design");
      if(option === "inner1") {
        inner.innerHTML = '<circle cx="400" cy="400" r="200" stroke="black" fill="none" stroke-width="5"/>';
      } else {
        inner.innerHTML = '<rect x="250" y="250" width="300" height="300" stroke="black" fill="none" stroke-width="5"/>';
      }
    }

    function setBorder(option) {
      const border = document.getElementById("border");
      if(option === "border1") {
        border.innerHTML = '<path d="M10,10 L790,10 L790,790 L10,790 Z" stroke="black" fill="none" stroke-width="10"/>';
      } else {
        border.innerHTML = '<circle cx="400" cy="400" r="390" stroke="black" fill="none" stroke-width="10"/>';
      }
    }

    function setInnerColor(hex) {
      document.querySelectorAll("#inner-design *").forEach(el => el.setAttribute("stroke", hex));
      updateCaption();
    }

    function setBorderColor(hex) {
      document.querySelectorAll("#border *").forEach(el => el.setAttribute("stroke", hex));
      updateCaption();
    }

    function setBackground(hex) {
      document.getElementById("canvasWrapper").style.backgroundColor = hex;
      updateCaption();
    }

    function updateCaption() {
      const innerColor = document.querySelector("#inner-design *")?.getAttribute("stroke") || "#000000";
      const borderColor = document.querySelector("#border *")?.getAttribute("stroke") || "#000000";
      const bgColor = document.getElementById("canvasWrapper").style.backgroundColor;
      document.getElementById("color-info").textContent = `Inner:${innerColor} | Border:${borderColor} | Background:${bgColor}`;
      document.getElementById("color-chip").style.background = innerColor;
    }

    function saveImage() {
      const canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 950;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = document.getElementById("canvasWrapper").style.backgroundColor;
      ctx.fillRect(0,0,800,950);

      ctx.fillStyle = "black";
      ctx.font = "16px Arial";
      ctx.fillText("SVG 저장은 canvg 같은 라이브러리 필요", 20, 920);

      const pngFile = canvas.toDataURL("image/png");
      const downloadLink = document.createElement("a");
      downloadLink.download = "bandana.png";
      downloadLink.href = pngFile;
      downloadLink.click();
    }
  </script>
</body>
</html>
