<!DOCTYPE html>
<html lang="ko">
  <head>
        <meta charset="UTF-8">
        <title>Bandana Simulator MVP</title>
      <style>
                body { font-family: Arial, sans-serif; text-align: center; }
                button, input { margin: 5px; padding: 10px; }
                #canvasWrapper {
                              position: relative;
                              width: 800px;
                              height: 950px;
                              margin: auto;
                              background-color: #FFFFFF;
                }
                #border-container {
                              position: absolute;
                              top: 0;
                              left: 0;
                              width: 100%;
                              height: 800px;
                }
                #border-container img {
                              width: 100%;
                              height: 100%;
                }
                #inner-container {
                              position: absolute;
                              top: 100px;
                              left: 100px;
                              width: 600px;
                              height: 600px;
                              overflow: hidden;
                }
                #inner-container img {
                              width: 100%;
                              height: 100%;
                              object-fit: cover;
                }
                #caption {
                              position: absolute;
                              top: 800px;
                              left: 0;
                              width: 800px;
                              height: 150px;
                              background: white;
                }
                #color-chip { width:40px; height:40px; display:inline-block; vertical-align:middle; }
                #saveBtn { margin-top: 30px; padding: 12px 20px; font-weight: bold; }
            </style>
  </head>
  <body>
        <h1>Bandana Simulator</h1>
      
      <!-- 내부 디자인 선택 -->
      <button onclick="setInner('inner1')">내부 디자인 1</button>button>
      <button onclick="setInner('inner2')">내부 디자인 2</button>button>
      
      <!-- 테두리 선택 -->
      <div>
                <button onclick="setBorder('border1')">테두리 1</button>button>
                <button onclick="setBorder('border2')">테두리 2</button>button>
                <button onclick="setBorder('border3')">테두리 3</button>button>
                <button onclick="setBorder('border4')">테두리 4</button>button>
                <button onclick="setBorder('border5')">테두리 5</button>button>
                <button onclick="setBorder('border6')">테두리 6</button>button>
                <button onclick="setBorder('border7')">테두리 7</button>button>
      </div>

        <!-- 색상 컬러피커 버튼 -->
        <div>
                  <button onclick="document.getElementById('innerColorPicker').click()">Inner 색상</button>button>
                  <input type="color" id="innerColorPicker" value="#000000" style="display:none;" onchange="setInnerColor(this.value)">
                  <button onclick="document.getElementById('borderColorPicker').click()">Border 색상</button>button>
                  <input type="color" id="borderColorPicker" value="#000000" style="display:none;" onchange="setBorderColor(this.value)">
                  <button onclick="document.getElementById('bgColorPicker').click()">배경 색상</button>button>
                  <input type="color" id="bgColorPicker" value="#FFFFFF" style="display:none;" onchange="setBackground(this.value)">
        </div>

        <!-- 시뮬레이터 영역 -->
        <div id="canvasWrapper">
                  <!-- 테두리 이미지 -->
                  <div id="border-container">
                                <img id="border-img" src="images/border1.svg" alt="Border" onerror="handleImageError(this, 'border')" style="filter: drop-shadow(0 0 0px rgba(0,0,0,0));">
                  </div>
                  <!-- 내부 디자인 이미지 -->
                  <div id="inner-container">
                                <img id="inner-img" src="images/inner1.svg" alt="Inner Design" onerror="handleImageError(this, 'inner')" style="filter: drop-shadow(0 0 0px rgba(0,0,0,0));">
                  </div>
                  <!-- 캡션 -->
                  <div id="caption">
                                <p id="color-info">Inner:#000000 | Border:#000000 | Background:#FFFFFF</p>p>
                                <div id="color-chip" style="background:#000000;"></div>
                                <p id="version-info">Version 3 | 2026-04-27</p>p>
                  </div>
        </div>

        <!-- PNG 저장 버튼 -->
        <button id="saveBtn" onclick="saveImage()">PNG 저장</button>button>

        <script>
                  let currentBorder = 'border1';
                  let currentInner = 'inner1';
                  let innerColorValue = '#000000';
                  let borderColorValue = '#000000';

                  function setInner(option) {
                                currentInner = option;
                                const innerImg = document.getElementById('inner-img');
                                const path = 'images/' + option + '.svg';
                                innerImg.src = path;
                                applyColorFilters();
                  }

                  function setBorder(option) {
                                currentBorder = option;
                                const borderImg = document.getElementById('border-img');
                                const path = 'images/' + option + '.svg';
                                borderImg.src = path;
                                applyColorFilters();
                  }

                  function setInnerColor(hex) {
                                innerColorValue = hex;
                                document.getElementById('innerColorPicker').value = hex;
                                applyColorFilters();
                                updateCaption();
                  }

                  function setBorderColor(hex) {
                                borderColorValue = hex;
                                document.getElementById('borderColorPicker').value = hex;
                                applyColorFilters();
                                updateCaption();
                  }

                  function setBackground(hex) {
                                document.getElementById('canvasWrapper').style.backgroundColor = hex;
                                updateCaption();
                  }

                  function applyColorFilters() {
                                // SVG 이미지의 색상을 변경하기 위해 CSS 필터를 사용
                                const innerImg = document.getElementById('inner-img');
                                const borderImg = document.getElementById('border-img');

                                // 색상값을 RGB로 변환
                                const innerRGB = hexToRgb(innerColorValue);
                                const borderRGB = hexToRgb(borderColorValue);

                                // 색상 변경을 위한 SVG 필터 적용
                                if (innerImg && innerRGB) {
                                                  const innerHSL = rgbToHsl(innerRGB.r, innerRGB.g, innerRGB.b);
                                                  innerImg.style.filter = `hue-rotate(${innerHSL.h}deg) saturate(1.5) brightness(1)`;
                                }

                                if (borderImg && borderRGB) {
                                                  const borderHSL = rgbToHsl(borderRGB.r, borderRGB.g, borderRGB.b);
                                                  borderImg.style.filter = `hue-rotate(${borderHSL.h}deg) saturate(1.5) brightness(1)`;
                                }
                  }

                  function hexToRgb(hex) {
                                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                                return result ? {
                                                  r: parseInt(result[1], 16),
                                                  g: parseInt(result[2], 16),
                                                  b: parseInt(result[3], 16)
                                } : null;
                  }

                  function rgbToHsl(r, g, b) {
                                r /= 255;
                                g /= 255;
                                b /= 255;
                                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                                let h, s, l = (max + min) / 2;

                                if(max === min){
                                                  h = s = 0;
                                } else {
                                                  const d = max - min;
                                                  s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                                                  switch(max){
                                                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                                                    case g: h = (b - r) / d + 2; break;
                                                    case b: h = (r - g) / d + 4; break;
                                                  }
                                                  h /= 6;
                                }

                                return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
                  }

                  function updateCaption() {
                                const innerColor = document.getElementById('innerColorPicker').value;
                                const borderColor = document.getElementById('borderColorPicker').value;
                                const bgColor = document.getElementById('bgColorPicker').value;

                                document.getElementById('color-info').textContent = `Inner:${innerColor} | Border:${borderColor} | Background:${bgColor}`;
                                document.getElementById('color-chip').style.background = innerColor;
                  }

                  function handleImageError(img, type) {
                                console.error(`Failed to load ${type} image:`, img.src);
                                img.style.display = 'none';
                                img.parentElement.style.backgroundColor = '#f0f0f0';
                                img.parentElement.innerHTML = `<p style="padding-top: 300px; color: red;">Failed to load ${type} image</p>`;
                  }

                  function saveImage() {
                                alert('PNG 저장 기능은 canvas-based SVG 렌더링이 필요합니다.\\n현재 버전에서는 브라우저의 스크린샷 기능을 사용해주세요.');
                  }

                  // 페이지 로드 시 초기화
                  window.addEventListener('DOMContentLoaded', function() {
                                updateCaption();
                  });
        </script>
  </body>
</html>html>
        </script>
        </div>
      </div></h1>
  </body>
      </style></title>
  </head>
